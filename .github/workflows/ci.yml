name: CI

on: 
  push: 
    branches: 
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    strategy: 
      matrix: 
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{matrix.os}}

    steps: 
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Run app on sample input
        run: dotnet run --no-build --configuration Release --project src/NameSorter -- ./unsorted-names-list.txt